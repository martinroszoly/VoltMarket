<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VoltMarket belépés" />
  <title>Belépés · VoltMarket</title>
  <link rel="stylesheet" href="styles.css?v=5.1" />
</head>
<body class="auth-required">
  <section id="authGate" class="auth-gate" aria-labelledby="authTitle">
    <div class="auth-card">
      <span class="eyebrow">VOLT//ACCESS</span>
      <h1 id="authTitle">Lépj be a VoltMarketbe</h1>
      <p id="authMessage">A játékállásod felhőben, a saját profilodhoz kötve lesz mentve.</p>
      <form id="authForm" novalidate>
        <label id="authNameField" class="auth-field" hidden>Játékosnév<input id="authName" type="text" autocomplete="name" /></label>
        <label class="auth-field">E-mail<input id="authEmail" type="email" autocomplete="email" required /></label>
        <label class="auth-field">Jelszó<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required /></label>
        <button id="authSubmit" class="primary wide" type="submit">Belépés</button>
      </form>
      <button id="authMode" class="auth-link" type="button">Új profil létrehozása</button>
      <button id="authReset" class="auth-link" type="button">Elfelejtett jelszó</button>
      <button id="authVerify" class="auth-link" type="button" hidden>Megerősítő e-mail újraküldése</button>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
    </div>
  </section>
  <script type="module" src="firebase-auth.js?v=13"></script>
</body>
</html>
